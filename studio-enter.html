<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;900&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090c; --panel:#14141a; --line:rgba(233,201,126,.16); --line2:rgba(255,255,255,.08);
  --ink:#EEECE3; --dim:#a8a49a; --faint:#726f67; --gold:#E7C983; --gold-d:#C79A44;
  --grad:linear-gradient(135deg,#F6E6B8,#E7C983 45%,#C79A44);
  --display:'Fraunces','Gowun Batang',Georgia,serif; --kser:'Gowun Batang','Fraunces',serif;
  --body:'Noto Sans KR','Pretendard',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
.enter{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;}
.enter::before{content:"";position:absolute;inset:0;pointer-events:none;background:
   radial-gradient(55% 42% at 50% 0%,rgba(231,201,131,.16),transparent 62%),
   radial-gradient(40% 34% at 84% 88%,rgba(231,201,131,.07),transparent 60%);}
.enter a{color:inherit;text-decoration:none;}
.orb{position:absolute;width:520px;height:520px;border-radius:50%;top:-230px;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(231,201,131,.14),transparent 68%);filter:blur(20px);animation:breathe 7s ease-in-out infinite;}
@keyframes breathe{50%{opacity:.55;transform:translateX(-50%) scale(1.08);}}

.card{position:relative;z-index:2;width:100%;max-width:520px;text-align:center;
  background:linear-gradient(165deg,rgba(231,201,131,.06),var(--panel));
  border:1px solid var(--line);border-radius:26px;padding:52px 40px 44px;
  box-shadow:0 40px 100px -40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04);
  animation:rise .8s cubic-bezier(.2,.7,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}

.brand{display:inline-flex;flex-direction:column;gap:5px;line-height:1;margin-bottom:26px;}
.brand b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em;}
.brand small{font-family:var(--mono);font-size:8px;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  display:inline-block;border:1px solid var(--line);border-radius:100px;padding:6px 14px;margin-bottom:20px;}
.card h1{font-family:var(--kser);font-size:clamp(26px,6.4vw,34px);line-height:1.34;font-weight:700;margin:0;}
.card h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.card p.lead{color:var(--dim);font-size:15.5px;line-height:1.75;margin:18px auto 0;max-width:400px;}

.enter-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:30px;
  font-family:var(--body);font-weight:800;font-size:18px;color:#241a05;background:var(--grad);
  border:none;border-radius:15px;padding:18px 24px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -16px rgba(231,201,131,.6);transition:transform .16s ease,box-shadow .16s ease;}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 24px 50px -16px rgba(231,201,131,.72);}
.enter-btn::after{content:"";position:absolute;top:0;left:-130%;width:55%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);
  animation:sheen 3.6s ease-in-out infinite;}
@keyframes sheen{0%,55%{left:-130%;}82%,100%{left:170%;}}

.checks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:26px;
  font-size:12.5px;color:var(--faint);}
.checks span{display:inline-flex;align-items:center;gap:6px;}
.checks i{color:var(--gold);font-style:normal;font-weight:800;}

.hint{margin-top:26px;padding-top:22px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--faint);line-height:1.7;}
.hint b{color:var(--dim);font-weight:600;}

.foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;z-index:2;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;}

@media(prefers-reduced-motion:reduce){.card,.orb,.enter-btn::after{animation:none!important;}}
</style>

<div class="enter">
  <div class="orb"></div>

  <div class="card">
    <span class="brand"><b>MONEY CREW</b><small>전자책 스튜디오 · E-BOOK STUDIO</small></span>

    <div><span class="eyebrow">Welcome · 구매자 전용</span></div>
    <h1><span class="g">전자책 스튜디오</span>에<br>오신 것을 환영합니다</h1>
    <p class="lead">구매해 주셔서 감사합니다. 준비되셨다면 아래 버튼을 눌러 프로그램에 입장하세요.</p>

    <a class="enter-btn" href="https://yuns52775-ops.github.io/mc-class-f7dfe8/studio.html" target="_top">프로그램 입장하기 &nbsp;→</a>

    <div class="checks">
      <span><i>✓</i> 설치 없이 브라우저에서</span>
      <span><i>✓</i> 작업은 자동 저장</span>
      <span><i>✓</i> 여러 권 제작 가능</span>
    </div>

    <div class="hint">
      처음이신가요? 입장 후 상단 <b>[GPT 키 발급·사용 설명서]</b>를 먼저 확인하면,<br>내 GPT 키를 넣고 바로 전자책을 만들 수 있어요.
    </div>
  </div>

  <div class="foot">Money Crew · E-Book Studio</div>
</div>
